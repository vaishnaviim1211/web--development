<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Development Assignments</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FF5F6D, #FFC371, #42e695, #3bb2b8);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    h1, h2, .roll {
      color: black;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      margin: 5px 0;
    }

    .roll {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .assignment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .assignment-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, background 0.3s;
    }

    .assignment-card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    .assignment-card a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #fdfdfd;
      text-shadow: 1px 1px 2px #000;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }
      .assignment-card a {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>D.Y. Patil College of Engineering and Technology, Kolhapur</h1>
    <h2>Vaishnavi Mallikarjun Managuli</h2>
    <div class="roll">Roll No: 104</div>

    <div class="assignment-grid">
      <div class="assignment-card"><a href="Assignment2.html">Assignment 2</a></div>
      <div class="assignment-card"><a href="Assignment3.html">Assignment 3</a></div>
      <div class="assignment-card"><a href="Assignment4.html">Assignment 4</a></div>
      <div class="assignment-card"><a href="Assignment5.html">Assignment 5</a></div>
      <div class="assignment-card"><a href="Assignment6.html">Assignment 6</a></div>
      <div class="assignment-card"><a href="Assignment7.html">Assignment 7</a></div>
      <div class="assignment-card"><a href="Assignment8.html">Assignment 8</a></div>
      <div class="assignment-card"><a href="assignment9.html">Assignment 9</a></div>
      <div class="assignment-card"><a href="assignment10.html">Assignment 10</a></div>
    </div>

    <footer>
      &copy; 2025 Web Development Portfolio | Created by Vaishnavi M. M.
    </footer>
  </div>
</body>
</html>
