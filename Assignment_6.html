<!DOCTYPE html>
<html>
<head>
    <title>Frames Example</title>
</head>

<frameset rows="20%, 80%">
    <frame src="header.html" name="topFrame">
    <frameset cols="30%, 70%">
        <frame src="menu.html" name="leftFrame">
        <frame src="content.html" name="rightFrame">
    </frameset>
</frameset>
<noframes>
    <body>
        <p>Your browser does not support frames. Please update your browser.</p>
    </body>
</noframes>
</html>
